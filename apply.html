<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's See If You Qualify — Better Body Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="BADGE LOGO (Filled).png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-x: hidden;
    }
    /* Page-wide layer (same as .bg-glow in men.css) - sits underneath
       everything, combined with the hero-specific orbs below. */
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(59,130,246,0.20), transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(30,58,138,0.25), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(96,165,250,0.05), transparent 70%),
        linear-gradient(180deg, #05070d 0%, #0a1020 100%);
      background-color: #05070d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 64px;
    }
    @media (max-width: 640px) {
      body { padding: 0 16px 48px; }
    }
    /* Exact replica of the VSL hero section's glow (same values as
       .hero-coming-soon / .orb-float / .orb-float-2 in men.css/men.html),
       clipped to this wrapper only - relies on plain DOM paint order
       (this sits before .hero-content in the markup), not z-index. */
    .hero-wrap {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 40px;
    }
    @media (max-width: 640px) {
      .hero-wrap { padding: 32px 0 24px; }
    }
    .hero-orbs { position: absolute; inset: 0; pointer-events: none; }
    .orb-1 {
      position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
      width: 900px; height: 900px; border-radius: 50%;
      background: rgba(56, 182, 255, 0.15);
      filter: blur(160px);
    }
    .orb-2 {
      position: absolute; bottom: -20%; right: 10%;
      width: 500px; height: 500px; border-radius: 50%;
      background: rgba(59, 130, 246, 0.10);
      filter: blur(120px);
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, transparent 0%, #05070d 70%);
    }
    .hero-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    h1 {
      color: #ffffff;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(24px, 4.2vw, 38px);
      letter-spacing: -0.01em;
      line-height: 1.35;
      margin: 0 0 20px;
      max-width: 720px;
    }
    .hero-sub {
      color: #ffffff;
      text-align: center;
      font-size: clamp(15px, 1.6vw, 18px);
      line-height: 1.6;
      max-width: 640px;
      margin: 0 0 40px;
    }
    .survey-card {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      overflow: hidden;
      background: #05070d;
      border: 1px solid rgba(56, 182, 255, 0.3);
      box-shadow: 0 20px 60px -20px rgba(56, 182, 255, 0.4);
    }
    .survey-card iframe {
      display: block;
      width: 100%;
      height: 420px;
      border: 0;
      background: #05070d;
    }
    @media (max-width: 640px) {
      .survey-card iframe { height: 380px; }
    }
  </style>
</head>

<body>
  <div class="hero-wrap">
    <div class="hero-orbs">
      <div class="orb-1"></div>
      <div class="orb-2"></div>
      <div class="vignette"></div>
    </div>
    <div class="hero-content">
      <h1>Let's See If You <span style="color:#38B6FF;font-weight:800">Qualify</span> To Work With Us</h1>
      <p class="hero-sub">
        <strong style="color:#ffffff;">This application will take 60 seconds.</strong><br><br>
        If you qualify, you'll be invited to book a free call where we'll map out your plan to lose 10-20kg and get your energy back.
      </p>
      <p style="color:#ffffff;font-weight:700;font-size:18px;margin:0 0 20px;">Start Now 👇</p>
    </div>
  </div>
  <div class="survey-card">
    <iframe src="https://api.leadconnectorhq.com/widget/survey/XgvZ0aGeazDlYTpp8CQB"
      title="Better Body Academy application"
      allow="camera; microphone; autoplay; encrypted-media; fullscreen; payment"></iframe>
  </div>

  <script>
    // Report this page's height to a parent frame so the GHL embed can auto-resize.
    (function () {
      if (window.parent === window) return;
      var last = 0;
      function postHeight() {
        var h = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight
        );
        if (h && h !== last) { last = h; window.parent.postMessage({ bbaFrameHeight: h }, '*'); }
      }
      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);
      if (window.ResizeObserver) { try { new ResizeObserver(postHeight).observe(document.documentElement); } catch (e) {} }
      [200, 600, 1200, 2500].forEach(function (t) { setTimeout(postHeight, t); });
      window.addEventListener('message', function (e) { if (e.data === 'bbaRequestHeight') postHeight(); });
    })();
  </script>
</body>

</html>
