<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's See If You Qualify — Better Body Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="BADGE LOGO (Filled).png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(59,130,246,0.20), transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(30,58,138,0.25), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(96,165,250,0.05), transparent 70%),
        linear-gradient(180deg, #05070d 0%, #0a1020 100%);
      background-color: #05070d;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 24px;
    }
    @media (max-width: 640px) {
      body { padding: 32px 16px 16px; }
    }
    h1 {
      color: #ffffff;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 5.2vw, 46px);
      letter-spacing: -0.01em;
      line-height: 1.35;
      margin: 0 0 40px;
      max-width: 760px;
    }
    .hero-sub {
      color: #ffffff;
      text-align: center;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.7;
      max-width: 660px;
      margin: 0 0 48px;
    }
    iframe {
      display: block;
      width: 100%;
      max-width: 500px;
      height: 220px;
      border: 0;
    }
    @media (max-width: 640px) {
      iframe { height: 200px; }
    }
  </style>
</head>

<body>
  <h1>Let's See If You <span style="color:#38B6FF;font-weight:800">Qualify</span> To Work With Us</h1>
  <p class="hero-sub">
    <strong style="color:#ffffff;">This application will take 60 seconds.</strong><br><br>
    <span style="color:rgba(255,255,255,0.55);">If you qualify, you'll be invited to book a free call where we'll map out your plan to lose 10-20kg and get your energy back.</span>
  </p>
  <p style="color:#ffffff;font-weight:700;font-size:22px;margin:0 0 36px;">Start Now 👇</p>
  <iframe id="bba-survey" src="https://api.leadconnectorhq.com/widget/survey/XgvZ0aGeazDlYTpp8CQB"
    title="Better Body Academy application" scrolling="no"
    allow="camera; microphone; autoplay; encrypted-media; fullscreen; payment"></iframe>
  <script src="https://link.msgsndr.com/js/form_embed.js"></script>

  <script>
    // Fallback resize: some LeadConnector survey messages don't match
    // form_embed.js's expected shape, so also handle them directly.
    (function () {
      var f = document.getElementById('bba-survey');
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || typeof d !== 'object') return;
        var h = d.height || (d.data && d.data.height);
        if (h && Number(h) > 0) { f.style.height = Number(h) + 'px'; }
      });
    })();
  </script>

  <script>
    // Report this page's height to a parent frame so the GHL embed can auto-resize.
    //
    // NOTE: document.documentElement.scrollHeight is floored at the current
    // viewport height (i.e. the outer iframe's CURRENT box size) even when the
    // real content is much shorter - so once the outer frame starts tall, it
    // can never be told to shrink via scrollHeight. Measure the real bottom
    // edge of the content instead, via getBoundingClientRect, which reflects
    // actual layout regardless of how tall the iframe box currently is.
    (function () {
      if (window.parent === window) return;
      var last = 0;
      function postHeight() {
        var children = document.body.children;
        var maxBottom = 0;
        for (var i = 0; i < children.length; i++) {
          if (children[i].tagName === 'SCRIPT') continue;
          var bottom = children[i].getBoundingClientRect().bottom;
          if (bottom > maxBottom) maxBottom = bottom;
        }
        var paddingBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
        var h = Math.ceil(maxBottom + paddingBottom);
        if (h && h !== last) { last = h; window.parent.postMessage({ bbaFrameHeight: h }, '*'); }
      }
      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);
      if (window.ResizeObserver) { try { new ResizeObserver(postHeight).observe(document.body); } catch (e) {} }
      [200, 600, 1200, 2500, 4000].forEach(function (t) { setTimeout(postHeight, t); });
      window.addEventListener('message', function (e) { if (e.data === 'bbaRequestHeight') postHeight(); });
    })();
  </script>
</body>

</html>
